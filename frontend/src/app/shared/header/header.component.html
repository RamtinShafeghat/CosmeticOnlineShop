<header class="site-header">
  <div class="container header-inner">
    <a routerLink="/" class="brand-mark">Velora</a>

    <nav class="nav" aria-label="Primary">
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        {{ 'nav.home' | t }}
      </a>
      <a routerLink="/shop" routerLinkActive="active">{{ 'nav.shop' | t }}</a>
      <a routerLink="/cart" routerLinkActive="active" class="cart-link">
        {{ 'nav.bag' | t }}
        @if (cart.count() > 0) {
          <span class="cart-count">{{ cart.count() }}</span>
        }
      </a>

      @if (auth.isAuthenticated()) {
        <a routerLink="/account/orders" routerLinkActive="active">{{ 'nav.account' | t }}</a>
      } @else {
        <a routerLink="/login" routerLinkActive="active">{{ 'nav.signIn' | t }}</a>
      }

      <div class="lang-switch" role="group" [attr.aria-label]="'Language'">
        <button
          type="button"
          class="lang-btn"
          [class.active]="i18n.lang() === 'en'"
          (click)="i18n.setLang('en')"
        >
          {{ 'lang.en' | t }}
        </button>
        <button
          type="button"
          class="lang-btn"
          [class.active]="i18n.lang() === 'fa'"
          (click)="i18n.setLang('fa')"
        >
          {{ 'lang.fa' | t }}
        </button>
      </div>
    </nav>
  </div>
</header>
