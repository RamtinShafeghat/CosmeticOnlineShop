<a class="product-card" [routerLink]="['/product', product.slug]">
  <div class="media">
    <img [src]="product.imageUrl | assetUrl" [alt]="i18n.productName(product)" loading="lazy" />
    <button
      type="button"
      class="wishlist-toggle"
      [class.saved]="wishlist.has(product.id)"
      [attr.aria-label]="(wishlist.has(product.id) ? 'wishlist.remove' : 'wishlist.add') | t"
      [title]="(wishlist.has(product.id) ? 'wishlist.remove' : 'wishlist.add') | t"
      (click)="toggleWishlist($event)"
    >
      {{ wishlist.has(product.id) ? '♥' : '♡' }}
    </button>
  </div>
  <div class="meta">
    <p class="category">{{ i18n.categoryName(product) }}</p>
    <h3>{{ i18n.productName(product) }}</h3>
    @if ((product.ratingCount ?? 0) > 0) {
      <p class="rating">
        <span class="stars" aria-hidden="true">★</span>
        {{ product.averageRating | number: '1.1-1' }}
        <span class="count">({{ product.ratingCount }})</span>
      </p>
    }
    <p class="price">
      {{ product.price | currency: 'USD':'symbol':'1.2-2':i18n.locale() }}
    </p>
  </div>
</a>
