<section class="section">
  <div class="container fade-up">
    <div class="account-head">
      <div>
        <p class="eyebrow">{{ 'account.eyebrow' | t }}</p>
        <h1 class="section-title">{{ 'account.title' | t }}</h1>
        <p class="section-lead">
          {{ 'account.greeting' | t: { name: auth.profile()?.fullName || '' } }}
        </p>
      </div>
      <button type="button" class="btn btn-ghost" (click)="auth.logout()">
        {{ 'account.signOut' | t }}
      </button>
    </div>

    <nav class="account-nav" aria-label="Account">
      <a routerLink="/account/orders" routerLinkActive="active">{{ 'account.orders' | t }}</a>
      <a routerLink="/account/addresses" routerLinkActive="active">{{ 'account.addresses' | t }}</a>
      <a routerLink="/account/wishlist" routerLinkActive="active">{{ 'account.wishlist' | t }}</a>
    </nav>

    <router-outlet />
  </div>
</section>
