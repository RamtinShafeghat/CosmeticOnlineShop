<section class="page">
  <a routerLink="/products" class="back">{{ 'productForm.back' | t }}</a>
  <div class="head">
    <div>
      <p class="eyebrow">{{ 'productForm.eyebrow' | t }}</p>
      <h1>{{ (id ? 'productForm.edit' : 'productForm.new') | t }}</h1>
    </div>
  </div>

  <form class="form-panel" (ngSubmit)="save()">
    <div class="form-grid">
      <label>
        {{ 'productForm.nameEn' | t }}
        <input name="name" [(ngModel)]="form.name" required />
      </label>
      <label>
        {{ 'productForm.nameFa' | t }}
        <input name="nameFa" [(ngModel)]="form.nameFa" />
      </label>
      <label>
        {{ 'productForm.slug' | t }}
        <input name="slug" [(ngModel)]="form.slug" />
      </label>
      <label>
        {{ 'productForm.category' | t }}
        <select name="categoryId" [(ngModel)]="form.categoryId" required>
          @for (category of categories; track category.id) {
            <option [ngValue]="category.id">{{ i18n.categoryName(category) }}</option>
          }
        </select>
      </label>
      <label>
        {{ 'productForm.price' | t }}
        <input type="number" step="0.01" min="0" name="price" [(ngModel)]="form.price" required />
      </label>
      <label>
        {{ 'productForm.stock' | t }}
        <input type="number" min="0" name="stock" [(ngModel)]="form.stock" required />
      </label>
      <label>
        {{ 'productForm.brand' | t }}
        <input name="brand" [(ngModel)]="form.brand" />
      </label>
      <label>
        {{ 'productForm.skinType' | t }}
        <select name="skinType" [(ngModel)]="form.skinType">
          @for (skin of skinTypes; track skin) {
            <option [value]="skin">{{ i18n.skinType(skin) }}</option>
          }
        </select>
      </label>
    </div>

    <label class="checkbox">
      <input type="checkbox" name="isFeatured" [(ngModel)]="form.isFeatured" />
      {{ 'productForm.featured' | t }}
    </label>

    <label>
      {{ 'productForm.shortEn' | t }}
      <textarea name="shortDescription" rows="2" [(ngModel)]="form.shortDescription"></textarea>
    </label>
    <label>
      {{ 'productForm.shortFa' | t }}
      <textarea name="shortDescriptionFa" rows="2" [(ngModel)]="form.shortDescriptionFa"></textarea>
    </label>
    <label>
      {{ 'productForm.descEn' | t }}
      <textarea name="description" rows="4" [(ngModel)]="form.description"></textarea>
    </label>
    <label>
      {{ 'productForm.descFa' | t }}
      <textarea name="descriptionFa" rows="4" [(ngModel)]="form.descriptionFa"></textarea>
    </label>

    <div class="image-block">
      <div>
        <label>
          {{ 'productForm.imageFile' | t }}
          <input type="file" accept="image/*" (change)="onFileSelected($event)" />
        </label>
        <label>
          {{ 'productForm.imageUrl' | t }}
          <input name="imageUrl" [(ngModel)]="form.imageUrl" placeholder="https://..." />
        </label>
      </div>
      @if (previewUrl) {
        <div class="preview">
          <img [src]="previewUrl | assetUrl" alt="" />
        </div>
      }
    </div>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
    @if (message()) {
      <p class="ok">{{ message() }}</p>
    }

    <button class="btn" type="submit" [disabled]="saving() || uploading()">
      {{
        uploading()
          ? ('productForm.uploading' | t)
          : saving()
            ? ('common.saving' | t)
            : ('common.save' | t)
      }}
    </button>
  </form>
</section>
