<section class="login">
  <div class="login-media" aria-hidden="true">
    <div class="media-overlay"></div>
    <div class="media-copy">
      <p class="brand">Velora</p>
      <h1>Beauty operations, quietly refined.</h1>
      <p>Shape the catalog, refresh imagery, and follow every order from one calm studio.</p>
    </div>
  </div>

  <form class="card" (ngSubmit)="submit()">
    <p class="eyebrow">Admin access</p>
    <h2>Sign in</h2>
    <p class="hint">Use your Velora studio credentials to continue.</p>

    <label>
      Email
      <input type="email" name="email" [(ngModel)]="email" required />
    </label>
    <label>
      Password
      <input type="password" name="password" [(ngModel)]="password" required />
    </label>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <button class="btn" type="submit" [disabled]="loading()">
      {{ loading() ? 'Signing in…' : 'Enter studio' }}
    </button>
  </form>
</section>
