<section class="page">
  <a routerLink="/categories" class="back">{{ 'categoryForm.back' | t }}</a>
  <div class="head">
    <div>
      <p class="eyebrow">{{ 'categoryForm.eyebrow' | t }}</p>
      <h1>{{ (id ? 'categoryForm.edit' : 'categoryForm.new') | t }}</h1>
    </div>
  </div>

  <form class="form-panel" (ngSubmit)="save()">
    <div class="form-grid">
      <label>
        {{ 'categoryForm.nameEn' | t }}
        <input name="name" [(ngModel)]="form.name" required />
      </label>
      <label>
        {{ 'categoryForm.nameFa' | t }}
        <input name="nameFa" [(ngModel)]="form.nameFa" />
      </label>
    </div>
    <label>
      {{ 'categoryForm.slug' | t }}
      <input name="slug" [(ngModel)]="form.slug" />
    </label>
    <label>
      {{ 'categoryForm.descEn' | t }}
      <textarea name="description" rows="3" [(ngModel)]="form.description"></textarea>
    </label>
    <label>
      {{ 'categoryForm.descFa' | t }}
      <textarea name="descriptionFa" rows="3" [(ngModel)]="form.descriptionFa"></textarea>
    </label>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <button class="btn" type="submit" [disabled]="saving()">
      {{ saving() ? ('common.saving' | t) : ('common.save' | t) }}
    </button>
  </form>
</section>
