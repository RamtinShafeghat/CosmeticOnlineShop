<section class="page">
  <a routerLink="/categories" class="back">← Back to categories</a>
  <div class="head">
    <div>
      <p class="eyebrow">Category editor</p>
      <h1>{{ id ? 'Edit category' : 'New category' }}</h1>
    </div>
  </div>

  <form class="form-panel" (ngSubmit)="save()">
    <div class="form-grid">
      <label>
        Name (EN)
        <input name="name" [(ngModel)]="form.name" required />
      </label>
      <label>
        Name (FA)
        <input name="nameFa" [(ngModel)]="form.nameFa" />
      </label>
    </div>
    <label>
      Slug (optional)
      <input name="slug" [(ngModel)]="form.slug" />
    </label>
    <label>
      Description (EN)
      <textarea name="description" rows="3" [(ngModel)]="form.description"></textarea>
    </label>
    <label>
      Description (FA)
      <textarea name="descriptionFa" rows="3" [(ngModel)]="form.descriptionFa"></textarea>
    </label>

    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <button class="btn" type="submit" [disabled]="saving()">
      {{ saving() ? 'Saving…' : 'Save category' }}
    </button>
  </form>
</section>
