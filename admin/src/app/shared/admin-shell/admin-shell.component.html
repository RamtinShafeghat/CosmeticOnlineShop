<div class="shell">
  <aside class="sidebar">
    <div class="brand">
      <p class="mark">Velora</p>
      <p class="sub">Studio Admin</p>
    </div>

    <nav>
      <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5Z" stroke="currentColor" stroke-width="1.6"/></svg>
        </span>
        Dashboard
      </a>
      <a routerLink="/categories" routerLinkActive="active">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M4 7h16M4 12h16M4 17h10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </span>
        Categories
      </a>
      <a routerLink="/products" routerLinkActive="active">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M7 7h10l1 13H6L7 7Z" stroke="currentColor" stroke-width="1.6"/><path d="M9 7a3 3 0 0 1 6 0" stroke="currentColor" stroke-width="1.6"/></svg>
        </span>
        Products
      </a>
      <a routerLink="/orders" routerLinkActive="active">
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none"><path d="M6 7h12l1 12H5L6 7Z" stroke="currentColor" stroke-width="1.6"/><path d="M9 10v2m6-2v2M9 7V5a3 3 0 0 1 6 0v2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </span>
        Orders
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="profile-chip">
        <span class="avatar">{{ (auth.profile()?.displayName || 'A').charAt(0) }}</span>
        <div>
          <p>{{ auth.profile()?.displayName || 'Admin' }}</p>
          <p class="email">{{ auth.profile()?.email }}</p>
        </div>
      </div>
      <button type="button" class="logout" (click)="auth.logout()">Sign out</button>
    </div>
  </aside>

  <section class="content">
    <header class="topbar">
      <div>
        <p class="eyebrow">Velora control room</p>
        <p class="greeting">Keep the catalog luminous.</p>
      </div>
      <div class="topbar-meta">
        <span class="live-dot" aria-hidden="true"></span>
        <span>Live storefront connected</span>
      </div>
    </header>
    <main>
      <router-outlet />
    </main>
  </section>
</div>
